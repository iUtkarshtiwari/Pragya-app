<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pragya Mobile App Simulator (React Native)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #050811;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .mobile-frame-container {
        width: 390px;
        height: 844px;
        background: #090d16;
        border-radius: 48px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 12px #1f293d, 0 0 0 14px #0b0f19;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .notch {
        width: 120px;
        height: 30px;
        background: #1f293d;
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }
      #root {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Cu8ob8pN.js"></script>
  </head>
  <body>
    <div class="mobile-frame-container">
      <div class="notch"></div>
      <div id="root"></div>
    </div>
  </body>
</html>
