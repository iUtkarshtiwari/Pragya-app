# Root Netlify config for the Pragya monorepo.
#
# IMPORTANT:
# Each Netlify site must be configured separately in the Netlify UI.
# Do not use the repo root as the deploy target when multiple apps exist.
#
# Admin site:
#   Base directory: apps/admin-web
#   Build command: npm run build
#   Publish directory: dist
#
# Exam site:
#   Base directory: apps/exam-web
#   Build command: npm run build
#   Publish directory: dist
#
# This file intentionally avoids [build] settings so it cannot override the
# per-site configuration in Netlify. The app-specific netlify.toml files under
# apps/admin-web and apps/exam-web are the ones that should define the build.

[build.environment]
  NODE_VERSION = "20"
